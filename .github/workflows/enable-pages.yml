# 一時的な復旧用ワークフロー
#
# 2026-07-28 にリポジトリを一時 Private 化した際に GitHub Pages が自動停止した。
# このワークフローは Pages サイトを再作成し、元の
# 「Deploy from a branch (main / root)」設定に戻す。復旧確認後は削除してよい。
name: Enable GitHub Pages

on:
  push:
    branches: [claude/personal-english-learning-app-2a9jo2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 元の「Deploy from a branch (main / root)」設定に復元し、初回ビルドを要求
      - name: Restore 'deploy from branch (main / root)' and request build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d "$payload")
          echo "PUT /pages -> $code"
          cat /tmp/resp.json || true
          case "$code" in
            2*) echo "Restored legacy branch deploy." ;;
            *) echo "Could not switch to legacy build."; exit 1 ;;
          esac
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds" || true

      - name: Verify Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages"
