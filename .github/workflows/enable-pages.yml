# 一時的な復旧用ワークフロー
#
# 2026-07-28 にリポジトリを一時 Private 化した際に GitHub Pages が自動停止した。
# このワークフローは Pages を「Deploy from a branch (main / root)」設定で
# 再有効化し、初回ビルドをリクエストする。復旧確認後は削除してよい。
name: Enable GitHub Pages

on:
  push:
    branches: [claude/personal-english-learning-app-2a9jo2]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (deploy from branch main, root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d "$payload")
          echo "POST /pages -> $code"
          cat /tmp/resp.json
          # 409/422 = すでに Pages サイトが存在する場合 → 設定更新に切り替え
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -s -o /tmp/resp2.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages" \
              -d "$payload")
            echo "PUT /pages -> $code"
            cat /tmp/resp2.json
          fi
          case "$code" in
            2*) echo "Pages enabled." ;;
            *) echo "Failed to enable Pages."; exit 1 ;;
          esac

      - name: Request initial Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds" || true
